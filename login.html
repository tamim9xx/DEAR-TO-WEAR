<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth Portal // DARE TO WEAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container nav-inner">
            <a href="index.html" class="brand-logo">DARE<span>TO</span>WEAR</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop Catalog</a></li>
                <li><a href="cart.html" class="cart-icon-wrapper">Cart <span class="cart-badge" id="cartBadge">0</span></a></li>
                <li><a href="login.html" class="active">Auth Portal</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:40px; max-width:900px; margin:60px auto; background:var(--card-bg); border:1px solid var(--card-border); padding:30px;">
            <!-- Login -->
            <div>
                <h3>Sign In</h3>
                <br>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPass" class="form-control" required>
                    </div>
                    <button type="submit" class="btn" style="width:100%;">Authenticate</button>
                </form>
            </div>

            <!-- Signup -->
            <div>
                <h3>Initialize Identity</h3>
                <br>
                <form id="signupForm">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="regName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPass" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-gold" style="width:100%;">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, updateCartBadge, setupAuthUI } from './js/firebase-config.js';
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        setupAuthUI();
        updateCartBadge();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, 
                    document.getElementById('loginEmail').value, 
                    document.getElementById('loginPass').value
                );
                window.location.href = "profile.html";
            } catch (err) {
                alert("Login Error: " + err.message);
            }
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const cred = await createUserWithEmailAndPassword(auth, 
                    document.getElementById('regEmail').value, 
                    document.getElementById('regPass').value
                );
                const role = (document.getElementById('regEmail').value === 'admin@daretowear.com') ? 'admin' : 'user';
                await setDoc(doc(db, "users", cred.user.uid), {
                    name: document.getElementById('regName').value,
                    email: document.getElementById('regEmail').value,
                    role: role
                });
                window.location.href = "profile.html";
            } catch (err) {
                alert("Signup Error: " + err.message);
            }
        });
    </script>
</body>
</html>
